[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-mercado"
version = "0.1.0"
description = "TFG: análisis de bolsa y cripto con deep learning"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# núcleo C++ (opcional): pip install -e ".[core]" && python core/build.py
core = ["pybind11>=3.0", "setuptools>=68"]
# tono con FinBERT (opcional; además de PyTorch): pip install -e ".[nlp]"
nlp = ["transformers>=4.40"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
